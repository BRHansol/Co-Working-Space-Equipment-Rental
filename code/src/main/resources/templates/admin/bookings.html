<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('รายการจอง')}"></head><body class="admin-body"><div class="admin-layout">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('bookings')}"></aside><main class="admin-main" id="main-content"><div th:replace="~{fragments/admin-sidebar :: topbar('รายการจอง')}"></div><div th:replace="~{fragments/messages :: messages}"></div>
<div class="page-heading"><div><h1>รายการจอง</h1><p>ตรวจคำขอและจัดการสถานะการจอง</p></div><a class="btn btn-primary" th:href="@{/admin/bookings/new}">จองแทนผู้ใช้</a></div>
<form class="card form-grid" th:action="@{/admin/bookings}" method="get"><div class="field"><label for="roomId">ห้อง</label><select id="roomId" name="roomId"><option value="">ทุกห้อง</option><option th:each="room : ${rooms}" th:value="${room.id}" th:text="${room.name}" th:selected="${room.id == roomId}"></option></select></div><div class="field"><label for="userId">ผู้จอง</label><select id="userId" name="userId"><option value="">ทุกผู้ใช้</option><option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}" th:selected="${user.id == userId}"></option></select></div><div class="field"><label for="status">สถานะ</label><select id="status" name="status"><option value="">ทุกสถานะ</option><option value="PENDING" th:selected="${status == 'PENDING'}">รออนุมัติ</option><option value="APPROVED" th:selected="${status == 'APPROVED'}">อนุมัติแล้ว</option><option value="REJECTED" th:selected="${status == 'REJECTED'}">ไม่อนุมัติ</option><option value="CANCELLED" th:selected="${status == 'CANCELLED'}">ยกเลิกแล้ว</option><option value="COMPLETED" th:selected="${status == 'COMPLETED'}">ใช้งานเสร็จสิ้น</option></select></div><button class="btn btn-primary" type="submit">ดูรายการ</button></form>
<section class="card"><p>ทั้งหมด <strong th:text="${totalElements}"></strong> รายการ</p><div th:replace="~{admin/fragments :: bookingTable(${bookings})}"></div><nav aria-label="หน้ารายการจอง" class="pagination"><a class="btn btn-secondary" th:if="${pageNumber > 0}" th:href="@{/admin/bookings(page=${pageNumber - 1},roomId=${roomId},userId=${userId},status=${status})}">ก่อนหน้า</a><span th:text="${'หน้า ' + (pageNumber + 1) + ' จาก ' + T(java.lang.Math).max(1, totalPages)}"></span><a class="btn btn-secondary" th:if="${pageNumber + 1 < totalPages}" th:href="@{/admin/bookings(page=${pageNumber + 1},roomId=${roomId},userId=${userId},status=${status})}">ถัดไป</a></nav></section>
</main></div></body></html>
