<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><body>
<input th:fragment="csrf" type="hidden" name="_csrf" th:value="${csrfToken}">
<div th:fragment="formErrors" class="notice notice-error" role="alert" tabindex="-1" th:if="${#fields.hasErrors('*')}"><h2>ตรวจข้อมูลอีกครั้ง</h2><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
<div th:fragment="bookingTable(rows)" class="table-wrap">
    <table class="data-table"><thead><tr><th scope="col">เลขการจอง</th><th scope="col">ห้อง / ผู้จอง</th><th scope="col">วันและเวลา</th><th scope="col">สถานะ</th><th scope="col">รายละเอียด</th></tr></thead>
        <tbody><tr th:each="booking : ${rows}"><td th:text="${ui.bookingCode(booking.id)}"></td><td><strong th:text="${booking.roomName}"></strong><br><span th:text="${booking.username}"></span></td><td><span th:text="${ui.date(booking.startTime)}"></span><br><span th:text="${ui.time(booking.startTime) + '–' + ui.time(booking.endTime)}"></span></td><td><span class="status-pill" th:classappend="${ui.statusClass(booking.status)}" th:text="${ui.statusLabel(booking.status)}"></span></td><td><a class="btn btn-text" th:href="@{/admin/bookings/{id}(id=${booking.id})}">ดูรายละเอียด →</a></td></tr></tbody>
    </table>
    <div class="empty-state" th:if="${#lists.isEmpty(rows)}"><h2>ยังไม่มีรายการจอง</h2><p>เลือกรายการอื่น หรือสร้างคำขอจองใหม่</p></div>
</div>
</body></html>
