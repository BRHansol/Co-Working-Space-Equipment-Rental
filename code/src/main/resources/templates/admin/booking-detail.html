<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('พิจารณาการจอง')}"></head><body class="admin-body"><div class="admin-layout">
<aside th:replace="~{fragments/admin-sidebar :: sidebar('bookings')}"></aside><main class="admin-main" id="main-content"><div th:replace="~{fragments/admin-sidebar :: topbar('รายละเอียดการจอง')}"></div><div th:replace="~{fragments/messages :: messages}"></div>
<a class="btn btn-text" th:href="@{/admin/bookings}">← กลับไปรายการจอง</a><div class="page-heading"><h1 th:text="${ui.bookingCode(booking.id)}"></h1><span class="status-pill" th:classappend="${ui.statusClass(booking.status)}" th:text="${ui.statusLabel(booking.status)}"></span></div>
<div class="split-layout"><section class="card"><h2 th:text="${booking.roomName}"></h2><dl class="summary-list"><div><dt>ผู้จอง</dt><dd th:text="${booking.username}"></dd></div><div><dt>วันที่</dt><dd th:text="${ui.date(booking.startTime)}"></dd></div><div><dt>เวลา</dt><dd th:text="${ui.time(booking.startTime) + '–' + ui.time(booking.endTime)}"></dd></div><div><dt>วัตถุประสงค์</dt><dd th:text="${#strings.isEmpty(booking.purpose) ? 'ไม่ได้ระบุ' : booking.purpose}"></dd></div></dl><h3>อุปกรณ์เพิ่มเติม</h3><p th:if="${#lists.isEmpty(booking.equipmentItems)}">ไม่มีอุปกรณ์เพิ่มเติม</p><ul><li th:each="item : ${booking.equipmentItems}" th:text="${item.equipmentName + ' × ' + item.quantity}"></li></ul></section>
<aside class="card summary-card"><h2>ดำเนินการกับคำขอ</h2><p>ตรวจรายละเอียดก่อนเปลี่ยนสถานะ</p><form th:if="${booking.status.name() == 'PENDING'}" th:action="@{/admin/bookings/{id}/status(id=${booking.id})}" method="post"><input th:replace="~{admin/fragments :: csrf}"><input type="hidden" name="status" value="APPROVED"><button class="btn btn-primary" type="submit">อนุมัติการจอง</button></form><form th:if="${booking.status.name() == 'PENDING'}" th:action="@{/admin/bookings/{id}/status(id=${booking.id})}" method="post" data-confirm="ไม่อนุมัติคำขอจองนี้?"><input th:replace="~{admin/fragments :: csrf}"><input type="hidden" name="status" value="REJECTED"><button class="btn btn-danger" type="submit">ไม่อนุมัติ</button></form><a class="btn btn-secondary" th:if="${booking.status.name() == 'PENDING'}" th:href="@{/bookings/{id}/edit(id=${booking.id})}">แก้ไขการจอง</a><form th:if="${booking.status.name() == 'PENDING' or booking.status.name() == 'APPROVED'}" th:action="@{/admin/bookings/{id}/status(id=${booking.id})}" method="post" data-confirm="ยกเลิกการจองนี้?"><input th:replace="~{admin/fragments :: csrf}"><input type="hidden" name="status" value="CANCELLED"><button class="btn btn-secondary" type="submit">ยกเลิกการจอง</button></form><form th:if="${booking.status.name() == 'APPROVED'}" th:action="@{/admin/bookings/{id}/status(id=${booking.id})}" method="post"><input th:replace="~{admin/fragments :: csrf}"><input type="hidden" name="status" value="COMPLETED"><button class="btn btn-primary" type="submit">บันทึกว่าใช้งานเสร็จสิ้น</button></form><p class="notice" th:if="${booking.status.name() != 'PENDING' and booking.status.name() != 'APPROVED'}">รายการนี้สิ้นสุดแล้ว</p></aside></div>
</main></div></body></html>
