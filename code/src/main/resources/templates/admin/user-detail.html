<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('ข้อมูลผู้ใช้')}"></head><body class="admin-body"><div class="admin-layout"><aside th:replace="~{fragments/admin-sidebar :: sidebar('users')}"></aside><main class="admin-main" id="main-content"><div th:replace="~{fragments/admin-sidebar :: topbar('ข้อมูลผู้ใช้')}"></div><div th:replace="~{fragments/messages :: messages}"></div><a class="btn btn-text" th:href="@{/admin/users}">← กลับไปรายการผู้ใช้</a><div class="page-heading"><h1 th:text="${userDetail.username}"></h1></div>
<section class="card"><dl class="summary-list"><div><dt>ชื่อผู้ใช้</dt><dd th:text="${userDetail.username}"></dd></div><div><dt>อีเมล</dt><dd th:text="${userDetail.email}"></dd></div><div><dt>บทบาท</dt><dd th:text="${ui.roleLabel(userDetail.role)}"></dd></div><div><dt>วันที่สร้าง</dt><dd th:text="${ui.date(userDetail.created_at)}"></dd></div></dl><a class="btn btn-primary" th:href="@{/admin/bookings/new(userId=${userDetail.id})}">จองแทนผู้ใช้นี้</a></section>
<section class="card"><h2>การจองของผู้ใช้</h2><div th:replace="~{admin/fragments :: bookingTable(${bookings})}"></div></section>
</main></div></body></html>
