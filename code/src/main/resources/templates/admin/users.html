<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('จัดการผู้ใช้')}"></head><body class="admin-body"><div class="admin-layout"><aside th:replace="~{fragments/admin-sidebar :: sidebar('users')}"></aside><main class="admin-main" id="main-content"><div th:replace="~{fragments/admin-sidebar :: topbar('จัดการผู้ใช้')}"></div><div th:replace="~{fragments/messages :: messages}"></div><div class="page-heading"><h1>จัดการผู้ใช้</h1><p>สร้างบัญชีและดูข้อมูลผู้ใช้ในระบบ</p></div>
<div class="drawer-layout"><section class="card table-wrap"><table class="data-table"><thead><tr><th>ชื่อผู้ใช้ / อีเมล</th><th>บทบาท</th><th>วันที่สร้าง</th><th>จัดการ</th></tr></thead><tbody><tr th:each="user : ${users}"><td><strong th:text="${user.username}"></strong><br><span th:text="${user.email}"></span></td><td th:text="${ui.roleLabel(user.role)}"></td><td th:text="${ui.date(user.created_at)}"></td><td><a class="btn btn-text" th:href="@{/admin/users/{id}(id=${user.id})}">ดูข้อมูล</a><form th:if="${user.id != currentUser.id}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" data-confirm="ลบบัญชีผู้ใช้นี้?"><input th:replace="~{admin/fragments :: csrf}"><button class="btn btn-danger" type="submit">ลบ</button></form></td></tr></tbody></table><p class="empty-state" th:if="${#lists.isEmpty(users)}">ยังไม่มีผู้ใช้</p></section>
<section class="card"><h2>เพิ่มผู้ใช้</h2><form th:action="@{/admin/users}" method="post" th:object="${form}"><input th:replace="~{admin/fragments :: csrf}"><div th:replace="~{admin/fragments :: formErrors}"></div><div class="field"><label for="username">ชื่อผู้ใช้</label><input id="username" th:field="*{username}" minlength="4" maxlength="50" autocomplete="off" required><p class="hint">ชื่อผู้ใช้ 4–50 ตัวอักษร</p><p class="field-error" th:errors="*{username}"></p></div><div class="field"><label for="email">อีเมล</label><input id="email" type="email" th:field="*{email}" required autocomplete="off"><p class="field-error" th:errors="*{email}"></p></div><div class="field"><label for="password">รหัสผ่าน</label><input id="password" type="password" name="password" minlength="6" maxlength="72" required autocomplete="new-password"><p class="hint">รหัสผ่านอย่างน้อย 6 ตัวอักษร ไม่เกิน 72 ไบต์</p><p class="field-error" th:errors="*{password}"></p></div><div class="field"><label for="role">บทบาท</label><select id="role" th:field="*{role}"><option value="USER">USER — ผู้ใช้งานทั่วไป</option><option value="STAFF">STAFF — เจ้าหน้าที่</option><option value="ADMIN">ADMIN — ผู้ดูแลระบบ</option></select></div><button class="btn btn-primary" type="submit">สร้างผู้ใช้</button></form></section></div>
</main></div></body></html>
