<!doctype html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('ผลการจอง')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('bookings')}"></header>
<main id="main-content" class="page-shell narrow-shell">
  <section class="page-heading"><div><p class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</p><h1 th:text="${booking.status.name() == 'APPROVED' ? 'จองสำเร็จ' : (booking.status.name() == 'PENDING' ? 'ส่งคำขอจองแล้ว' : 'รายการจองของคุณ')}">ผลการจอง</h1><p class="muted">ระบบบันทึกรายการของคุณเรียบร้อย คุณดูสถานะปัจจุบันได้จากการจองของฉัน</p><p><strong th:text="${'BK-' + #numbers.formatInteger(booking.id, 4)}"></strong> <span class="status-pill" th:classappend="${ui.statusClass(booking.status)}" th:text="${ui.statusLabel(booking.status)}"></span></p></div></section>
  <div th:replace="~{fragments/messages :: messages}"></div>
  <p class="notice" th:if="${booking.status.name() == 'APPROVED'}">การจองได้รับอนุมัติแล้ว ห้องและอุปกรณ์ที่เลือกได้รับการจองตามวันเวลาที่ระบุ</p>
  <p class="notice" th:if="${booking.status.name() == 'PENDING'}">คำขออยู่ระหว่างรอผู้ดูแลระบบอนุมัติ กรุณาติดตามสถานะก่อนใช้งาน</p>
  <div th:replace="~{bookings/form-fields :: bookingFacts}"></div>
  <div class="form-actions"><a class="btn btn-primary" th:href="@{/bookings/{id}(id=${booking.id})}">ดูรายละเอียดการจอง</a><a class="btn btn-secondary" th:href="@{/bookings}">การจองของฉัน</a></div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
