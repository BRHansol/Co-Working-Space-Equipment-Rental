# Use through the local-postgres profile group to keep the session-based website.
# The postgres profile follows local, so these settings replace its H2 settings.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/room_booking}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Create/update the schema only during an explicit first-time setup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# This profile is for the website on this computer, not public deployment.
server.address=127.0.0.1
server.port=${LOCAL_SERVER_PORT:8080}
