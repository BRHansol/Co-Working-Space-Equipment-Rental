server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# This profile uses its own persistent database and never connects to PostgreSQL.
spring.datasource.url=jdbc:h2:file:./.local-data/room-booking;MODE=PostgreSQL;NON_KEYWORDS=USER;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
