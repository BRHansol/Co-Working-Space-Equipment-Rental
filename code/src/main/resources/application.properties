spring.application.name=roombooking
# รันบนเครื่อง: ใส่ค่า DB ในไฟล์ code/.env ได้ (ดูตัวอย่างที่ .env.example) ไฟล์ .env ถูก gitignore ไว้
spring.config.import=optional:file:.env[.properties]

# prod = หน้าเว็บ (web + postgres), api = REST API + Swagger (postgres)
spring.profiles.default=prod
spring.profiles.group.prod=web,postgres
spring.profiles.group.api=postgres

# Render ตั้ง DB_URL / DB_USERNAME ไว้; ถ้าไม่มี DB_URL จะประกอบจาก DB_HOST, DB_PORT, DB_NAME, DB_SSLMODE แทน
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:room_booking}?sslmode=${DB_SSLMODE:prefer}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:postgres}

# Bootstrap the PostgreSQL schema explicitly before starting the application.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
