spring.application.name=roombooking
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=prod
spring.profiles.group.prod=web,postgres
spring.profiles.group.api=postgres

# Configure these in the deployment environment; there is no embedded database fallback.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Bootstrap the PostgreSQL schema explicitly before starting the application.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework