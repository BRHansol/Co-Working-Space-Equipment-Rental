spring.application.name=roombooking
spring.profiles.default=local
spring.profiles.group.local-postgres=local,postgres

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/room_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloud (Render/Railway/Heroku) จะส่ง port มาทาง env PORT ถ้าไม่มีใช้ 8080
server.port=${PORT:8080}
