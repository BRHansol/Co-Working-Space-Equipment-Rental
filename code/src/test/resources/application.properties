# ใช้ H2 in-memory แทน PostgreSQL ตอนรัน test จะได้ไม่ต้องเปิด DB จริง
spring.application.name=roombooking
spring.profiles.group.local-postgres=local,postgres

spring.datasource.url=jdbc:h2:mem:roombooking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
