services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: ${PORT:-8080}
      DB_URL: ${DB_URL:?Set the PostgreSQL JDBC URL}
      DB_USERNAME: ${DB_USERNAME:?Set the PostgreSQL username}
      DB_PASSWORD: ${DB_PASSWORD:?Set the PostgreSQL password}
    restart: unless-stopped
